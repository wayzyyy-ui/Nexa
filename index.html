<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NEXA Hub — смартфон, ноутбук и часы в одной системе</title>
    <!-- Поиск и превью ссылок: описание, адрес страницы, карточка для соцсетей и мессенджеров -->
    <meta name="description" content="NEXA Hub объединяет ваши устройства в одну систему: общие файлы, расписание на день, AI-Ассистент и поиск потерянного телефона. Вход по почте, без пароля." />
    <link rel="canonical" href="https://nexahub.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXA Hub" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="NEXA Hub — смартфон, ноутбук и часы в одной системе" />
    <meta property="og:description" content="NEXA Hub объединяет ваши устройства в одну систему: общие файлы, расписание на день, AI-Ассистент и поиск потерянного телефона. Вход по почте, без пароля." />
    <meta property="og:url" content="https://nexahub.ru/" />
    <meta property="og:image" content="https://nexahub.ru/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Знак NEXA" />
    <meta name="twitter:card" content="summary" />
    <!-- Установка на экран «Домой» (iPhone): описание приложения и иконки -->
    <!-- Описание приложения (manifest) — для iPhone, iPad и компьютеров.
         На Android NEXA ставится файлом APK: без manifest Chrome не предлагает
         «Установить приложение» как веб-приложение (PWA) -->
    <script>
      if (!/Android/i.test(navigator.userAgent)) {
        var nexaManifest = document.createElement("link");
        nexaManifest.rel = "manifest";
        nexaManifest.href = "/manifest.webmanifest";
        document.head.appendChild(nexaManifest);
      }
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NEXA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#01090F" />

  </head>
 <body>

</body>
</html>
