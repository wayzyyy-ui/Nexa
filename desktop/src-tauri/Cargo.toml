# Приложение NEXA для ПК (Tauri 2). Интерфейс — тот же сайт из src/, собранный в режиме
# desktop (npm run build:desktop → dist-desktop). Здесь только оболочка окна для Windows.
[package]
name = "nexa-desktop"
version = "0.1.0"
description = "NEXA — приложение для ПК"
edition = "2021"
publish = false

[lib]
name = "nexa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
# Запоминает размер, положение и «развёрнуто ли» окно между запусками
tauri-plugin-window-state = "=2.5.0"
# Окно «Сохранить как» (Windows)
rfd = "=0.17.2"
# Открыть ссылку в браузере и файл в программе Windows
open = "=5.4.4"
# Буфер обмена
arboard = "=3.6.1"
# Повторный запуск открывает уже запущенную NEXA (и передаёт ей ссылку nexa://)
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
# Ссылки nexa:// (схему регистрирует установщик)
tauri-plugin-deep-link = "=2.6.1"
# Автозапуск вместе с Windows (по умолчанию выключен)
tauri-plugin-autostart = "=2.7.0"
# Уведомления Windows с нажатием (переход на нужный экран)
tauri-winrt-notification = "=0.8.1"
# Обновления: скачать установщик, проверить подпись, поставить и перезапустить
tauri-plugin-updater = "=2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Меньше установщик: без отладочных сведений, с оптимизацией размера
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Сведения о компьютере для «Это устройство»: заряд, сеть, место на диске, имя
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
